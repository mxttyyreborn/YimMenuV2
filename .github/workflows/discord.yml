name: Discord Notify

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord webhook
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MESSAGE: |
            📦 **Repository Updated**
            👤 Author: ${{ github.actor }}
            🌿 Branch: ${{ github.ref_name }}
            📝 Commit: ${{ github.event.head_commit.message }}
